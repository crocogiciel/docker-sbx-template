# Requires Docker Sandboxes 0.36 or newer — that is where `schemaVersion: "2"`
# lands. An older `sbx` decodes this file with the v1 grammar instead and
# rejects `permissions` and `setup`; check with `sbx version`.
schemaVersion: "2"
kind: mixin
name: pnpm
version: "1.0.0"
displayName: pnpm
description: "Installs pnpm globally, with a usable global bin directory for the agent"
sourceURL: "https://github.com/crocogiciel/docker-sbx-template"

environment:
  variables:
    # Pinned so a rebuild installs the same pnpm. Referenced by the install
    # command below: install commands are shell strings, so ${PNPM_VERSION} is
    # expanded by `sh -c` (the spec grammar has no templating of its own).
    PNPM_VERSION: "11.21.0"

    # pnpm's own home: it holds the global bin directory and the
    # content-addressable store. Without it, `pnpm add -g` fails with "Unable
    # to find the global bin directory".
    PNPM_HOME: "/home/agent/.local/share/pnpm"

permissions:
  network:
    allow:
      # Package downloads, and the pnpm release that `npm install -g` fetches.
      - registry.npmjs.org

setup:
  # Each entry is a shell string run through `sh -c`, in declaration order, as
  # root unless `user` says otherwise.
  install:
    # Installed straight from the registry rather than through Corepack: the
    # Corepack bundled with the base image (0.24.0) cannot run current pnpm
    # releases — its shim loads the pnpm entrypoint in a vm context and dies on
    # `ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING`. pnpm makes Corepack redundant
    # anyway: since v10 it manages `packageManager` itself, so a project
    # pinning another version still gets that version.
    #
    # NPM_CONFIG_PREFIX is /usr/local/share/npm-global in the base image, which
    # is root-owned and already on PATH, so this must stay a root step.
    - command: 'npm install -g "pnpm@${PNPM_VERSION}"'
      description: "Install pnpm from the npm registry"

    # PATH is sandbox-managed, so the global bin directory is exported from the
    # persistent environment file instead — it is sourced by every shell, and
    # by every Bash tool call the agent makes (BASH_ENV / CLAUDE_ENV_FILE).
    # `pnpm setup` would write to ~/.bashrc, which non-interactive shells never
    # read, so the agent's own commands would not see it.
    #
    # The heredoc is quoted so the lines are written verbatim and resolved at
    # source time, once per shell. That file is re-sourced before every
    # command, hence the guard: PATH must not grow on each invocation.
    - command: |
        cat >> /etc/sandbox-persistent.sh <<'PNPM'
        # pnpm: expose the `pnpm add -g` bin directory. pnpm 11 links global
        # binaries into $PNPM_HOME/bin, pnpm 10 and older into $PNPM_HOME
        # itself — and a project pinning an older release through
        # `packageManager` runs with the old layout, so both are on PATH.
        export PNPM_HOME="${PNPM_HOME:-$HOME/.local/share/pnpm}"
        for pnpm_bin in "$PNPM_HOME/bin" "$PNPM_HOME"; do
          case ":$PATH:" in
            *":$pnpm_bin:"*) ;;
            *) PATH="$pnpm_bin:$PATH" ;;
          esac
        done
        export PATH
        unset pnpm_bin
        PNPM
      # The file belongs to the agent, and this is the agent's PATH.
      user: "1000"
      description: "Add the pnpm global bin directory to PATH"

agentInstructions:
  content: |
    pnpm is installed globally. Use it for Node.js dependency management in
    projects that have a `pnpm-lock.yaml`.

    - `pnpm install` reads `pnpm-lock.yaml`; use `pnpm install --frozen-lockfile`
      when the lockfile must not change.
    - A `packageManager` field in `package.json` wins: pnpm downloads and runs
      that version itself, so do not try to install it separately.
    - `pnpm add -g <pkg>` installs under $PNPM_HOME, whose bin directory is
      already on PATH — the installed command is runnable straight away.
