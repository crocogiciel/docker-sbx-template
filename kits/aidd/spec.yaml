# Requires Docker Sandboxes 0.36 or newer — that is where `schemaVersion: "2"`
# lands. An older `sbx` decodes this file with the v1 grammar instead and
# rejects `permissions`, `setup` and `agentInstructions`; check with
# `sbx version`.
schemaVersion: "2"
kind: mixin
name: aidd
version: "1.0.0"
displayName: AI-Driven Dev Framework
description: "Installs the AI-Driven Dev (AIDD) plugins into Claude Code: an SDLC of skills and agents, from idea to reviewed pull request"
sourceURL: "https://github.com/ai-driven-dev/framework"

permissions:
  network:
    allow:
      # `claude plugin marketplace add` clones
      # https://github.com/ai-driven-dev/framework.git over HTTPS. Plugin
      # installs are then served from that local clone.
      - github.com

setup:
  # Each entry is a shell string run through `sh -c`, in declaration order, as
  # root unless `user` says otherwise.
  install:
    # Run as the agent: `claude plugin install` writes to $HOME/.claude, so as
    # root it would land in /root and the agent would see nothing.
    #
    # The plugins that ship hooks need `node` on PATH — the sandbox agent images
    # provide it, which is why nothing is installed for them here.
    - command: |
        set -e
        command -v claude >/dev/null 2>&1 || {
          echo "aidd: this kit only applies to the claude-code agent" >&2
          exit 1
        }
        claude plugin marketplace add ai-driven-dev/framework
        # aidd-ui is flagged alpha upstream; it is installed here to match the
        # `aidd` template. Drop it from this list to stay on the stable set.
        for plugin in \
          aidd-context \
          aidd-refine \
          aidd-dev \
          aidd-vcs \
          aidd-pm \
          aidd-orchestrator \
          aidd-ui
        do
          claude plugin install "${plugin}@aidd-framework"
        done
      user: "1000"
      description: "Install the AIDD marketplace and plugins"

    # Installing a plugin records it in ~/.claude/settings.json
    # (`extraKnownMarketplaces` + `enabledPlugins`). The sandbox runtime
    # replaces that file with the host's own at session start, so on its own the
    # install above leaves every plugin `✘ disabled` in the session. Managed
    # settings live outside the home directory and take precedence, so the
    # wiring is copied there — the user file is left untouched, which keeps this
    # working should the runtime ever stop overwriting it (both files agree, and
    # these keys are objects, so a merge cannot double anything up).
    #
    # Merged rather than written: the file is shared with the agent image and
    # any other kit, so an existing one must survive.
    - command: |
        set -e
        managed=/etc/claude-code/managed-settings.json
        user=/home/agent/.claude/settings.json
        mkdir -p "$(dirname "$managed")"
        [ -s "$managed" ] || echo '{}' > "$managed"
        # Never create the user file from root — it would end up root-owned.
        # An empty second input makes the merge a no-op instead.
        [ -s "$user" ] || user=/dev/null
        tmp="$(mktemp)"
        jq -s '.[0] * (.[1]
                 | {extraKnownMarketplaces, enabledPlugins}
                 | with_entries(select(.value != null)))' \
           "$managed" "$user" > "$tmp"
        mv "$tmp" "$managed"
        chmod 0644 "$managed"
      description: "Keep the plugins enabled once the runtime replaces the user settings"

agentInstructions:
  content: |
    The AI-Driven Dev (AIDD) framework is installed as Claude Code plugins. Its
    skills are namespaced `/<plugin>:<skill>`, and cover a full SDLC:

    - `/aidd-orchestrator:01-sdlc "<goal>"` runs the whole pipeline: frame →
      plan → implement → validate → review → challenge → ship.
    - Single steps live in `aidd-dev` (`01-plan`, `02-implement`, `05-review`,
      `08-debug`, …), `aidd-context` (project onboarding and context artifacts),
      `aidd-pm` (backlog, user stories), `aidd-vcs` (commit, pull-request).

    Prefer these skills over an ad-hoc approach when the user asks for AIDD, a
    structured SDLC, or names one of the steps above. Run `/plugin` to list
    what is available.
