name: CD

# Use a concurrency group to ensure a single job is running at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel the previous job to issues during Docker push

on:
  # Manual trigger
  workflow_dispatch:

  # When a commit is pushed to main
  push:
    branches:
      - main

permissions:
  contents: read # To clone the repository
  packages: write # To push the image to the GitHub Container Registry

jobs:
  publish-templates:
    name: Build (${{ matrix.agent }} - ${{ matrix.template.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      # Both lists are matrix dimensions, so the jobs are their cartesian
      # product: every template is published for every agent, each agent being
      # a tag of that template's image.
      matrix:
        # The base agent image (used in the image tag and as the agent name in
        # the Dockerfile). Add an agent here to publish every template for it.
        agent: [claude-code]
        # Add more templates here.
        template:
          - context: templates/aidd
            image: ghcr.io/crocogiciel/sbx-template-aidd

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.template.context }}
          build-args: |
            BASE_AGENT=${{ matrix.agent }}
          file: ${{ matrix.template.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.template.image }}:${{ matrix.agent }}

  publish-kits:
    name: Publish kit (${{ matrix.kit }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Add more kits here.
        kit: [aidd, pnpm, mama]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install the sbx CLI
        # `sbx kit push` has no standalone distribution — pull the same
        # linux-amd64 release tarball `sbx` itself ships (matches the
        # runner's arch) and lift just the binary out of it.
        env:
          SBX_VERSION: "0.38.0"
        run: |
          curl -fsSL -o sbx.tar.gz \
            "https://github.com/docker/sbx-releases/releases/download/v${SBX_VERSION}/DockerSandboxes-linux-amd64.tar.gz"
          tar xzf sbx.tar.gz docker-sbx/sbx
          sudo install docker-sbx/sbx /usr/local/bin/sbx

      - name: Validate the kit
        run: sbx kit validate "kits/${{ matrix.kit }}"

      - name: Log in to GitHub Container Registry
        # A dedicated PAT, not GITHUB_TOKEN: pushing a brand-new OCI artifact
        # package via `sbx kit push` returned 403 permission_denied:
        # write_package with GITHUB_TOKEN, even though the same token +
        # docker/login-action pushes the template's container image fine in
        # the job above. GHCR's package-creation permission check doesn't
        # extend to GITHUB_TOKEN the same way for a non-container OCI
        # artifact. A PAT with the `write:packages` scope sidesteps it.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PACKAGES_TOKEN }}

      - name: Push the kit
        # `sbx kit push` reads from the Docker credential store, which
        # docker/login-action just populated for ghcr.io. Tagged both by the
        # kit's own spec.yaml version and `latest`, mirroring how the
        # template image above is tagged.
        run: |
          version="$(sbx kit inspect --json "kits/${{ matrix.kit }}" | jq -r .manifest.version)"
          image="ghcr.io/crocogiciel/sbx-kit-${{ matrix.kit }}"
          sbx kit push "kits/${{ matrix.kit }}" "${image}:${version}"
          sbx kit push "kits/${{ matrix.kit }}" "${image}:latest"
