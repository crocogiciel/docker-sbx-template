name: CD

# Use a concurrency group to ensure a single job is running at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel the previous job to issues during Docker push

on:
  # Manual trigger
  workflow_dispatch:

  # When a commit is pushed to master
  push:
    branches:
      - master

permissions:
  contents: read # To clone the repository
  packages: write # To push the image to the GitHub Container Registry

jobs:
  build:
    name: Build (${{ matrix.agent }} - ${{ matrix.template.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      # Both lists are matrix dimensions, so the jobs are their cartesian
      # product: every template is published for every agent, each agent being
      # a tag of that template's image.
      matrix:
        # The base agent image (used in the image tag and as the agent name in
        # the Dockerfile). Add an agent here to publish every template for it.
        agent: [claude-code]
        # Add more templates here.
        template:
          - context: templates/aidd
            image: ghcr.io/crocogiciel/sbx-aidd

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.template.context }}
          build-args: |
            BASE_AGENT=${{ matrix.agent }}
          file: ${{ matrix.template.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.template.image }}:${{ matrix.agent }}
